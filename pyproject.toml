[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chapterscore"
version = "0.4.0"
description = "Generate Spotify playlists that match the emotional vibe of a book — chapter by chapter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ChapterScore" }]
keywords = ["spotify", "books", "playlist", "cli", "music", "literature"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "spotipy>=2.24.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "platformdirs>=4.2.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
web = [
    "streamlit>=1.32.0",
]

[project.scripts]
chapterscore = "chapterscore.cli:app"

[project.urls]
Homepage = "https://github.com/chapterscore/chapterscore"
Documentation = "https://github.com/chapterscore/chapterscore#readme"

[tool.hatch.build.targets.sdist]
include = ["src/chapterscore", "README.md", "LICENSE", ".env.example"]

[tool.hatch.build.targets.wheel]
packages = ["src/chapterscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
